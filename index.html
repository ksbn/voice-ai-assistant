<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel AI — Pro Voice Interface</title>
    <style>
        :root {
            --bg-deep: #050814;
            --card-bg: rgba(13, 19, 38, 0.75);
            --card-border: rgba(56, 189, 248, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-deep-blue: #0284c7;
            --accent-glow: rgba(56, 189, 248, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(2, 132, 199, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(37, 99, 235, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .app-container {
            width: 100%;
            max-width: 960px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 36px;
            border: 1px solid var(--card-border);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 50px var(--accent-glow);
            padding: 50px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            z-index: 1;
            margin: 20px;
        }

        .hero-section {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .hero-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .hero-headline {
            font-size: 40px;
            font-weight: 800;
            line-height: 1.15;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .hero-subtext {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .hero-right {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 260px;
        }

        .mockup-display {
            width: 220px;
            height: 220px;
            background: linear-gradient(145deg, rgba(20, 30, 60, 0.9), rgba(8, 12, 24, 0.95));
            border-radius: 40px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                0 0 30px rgba(2, 132, 199, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .mockup-display:hover {
            transform: translateY(-4px) scale(1.03);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(56, 189, 248, 0.35);
        }

        .wave-bars {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 36px;
        }

        .wave-bar {
            width: 4px;
            background: var(--accent-blue);
            border-radius: 10px;
            animation: idlePulse 1.4s ease-in-out infinite alternate;
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .wave-bar:nth-child(1) { height: 12px; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 26px; animation-delay: 0.3s; background: #60a5fa; }
        .wave-bar:nth-child(3) { height: 38px; animation-delay: 0.2s; background: #93c5fd; }
        .wave-bar:nth-child(4) { height: 22px; animation-delay: 0.4s; background: #60a5fa; }
        .wave-bar:nth-child(5) { height: 12px; animation-delay: 0.5s; }

        @keyframes idlePulse {
            0% { transform: scaleY(0.5); opacity: 0.5; }
            100% { transform: scaleY(1.3); opacity: 1; }
        }

        .soundbar-panel {
            position: absolute;
            width: 260px;
            height: 90px;
            background: rgba(13, 19, 38, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 25px rgba(56, 189, 248, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 20px;
            display: none;
        }

        .sound-dot {
            width: 5px;
            background: linear-gradient(180deg, #38bdf8, #1d4ed8);
            border-radius: 10px;
            animation: soundWave 0.8s ease-in-out infinite alternate;
            box-shadow: 0 0 8px var(--accent-blue);
        }

        .sound-dot:nth-child(1) { height: 15px; animation-delay: 0.1s; }
        .sound-dot:nth-child(2) { height: 35px; animation-delay: 0.3s; }
        .sound-dot:nth-child(3) { height: 50px; animation-delay: 0.2s; }
        .sound-dot:nth-child(4) { height: 25px; animation-delay: 0.4s; }
        .sound-dot:nth-child(5) { height: 40px; animation-delay: 0.15s; }
        .sound-dot:nth-child(6) { height: 20px; animation-delay: 0.35s; }
        .sound-dot:nth-child(7) { height: 30px; animation-delay: 0.25s; }

        @keyframes soundWave {
            0% { transform: scaleY(0.4); opacity: 0.5; }
            100% { transform: scaleY(1.2); opacity: 1; }
        }

        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 15, 30, 0.6);
            padding: 16px 28px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }

        .status-msg {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-msg::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-blue);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .mic-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #050814;
            border: none;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .mic-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
        }

        .mic-btn.recording {
            background: linear-gradient(135deg, #f43f5e, #be123c);
            color: #ffffff;
            animation: pulseMic 1.2s infinite;
            box-shadow: 0 0 30px rgba(244, 63, 94, 0.6);
        }

        @keyframes pulseMic {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .hero-section {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .hero-left {
                align-items: center;
            }
            .app-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">

    <div class="hero-section">
        <div class="hero-left">
            <div class="badge-pill">
                ✦ Pro Neural Voice System
            </div>
            <h1 class="hero-headline">Deep interface. Immersive sound.</h1>
            <p class="hero-subtext">
                Daniel is engineered with ultra-low latency Groq intelligence inside a sleek, dark-blue frosted glass card environment.
            </p>
        </div>

        <div class="hero-right">
            <div class="mockup-display" id="idleCard" onclick="toggleListening()">
                <div class="wave-bars">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
            </div>

            <div class="soundbar-panel" id="soundbarPanel">
                <div class="sound-dot"></div>
                <div class="sound-dot"></div>
                <div class="sound-dot"></div>
                <div class="sound-dot"></div>
                <div class="sound-dot"></div>
                <div class="sound-dot"></div>
                <div class="sound-dot"></div>
            </div>
        </div>
    </div>

    <div class="control-bar">
        <div class="status-msg" id="statusText">System ready. Tap card to speak with Daniel</div>
        <button class="mic-btn" id="micBtn" onclick="toggleListening()">
            <span>🎙️</span> Initialize Voice
        </button>
    </div>

</div>

<script>
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    
    const idleCard = document.getElementById('idleCard');
    const soundbarPanel = document.getElementById('soundbarPanel');

    let isListening = false;
    let selectedVoice = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-GB';
        recognition.interimResults = false;

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('recording');
            micBtn.innerHTML = '<span>🔴</span> Listening...';
            statusText.innerText = 'Listening to your transmission...';
            showIdleState();
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('recording');
            micBtn.innerHTML = '<span>🎙️</span> Initialize Voice';
            if (statusText.innerText === 'Listening to your transmission...') {
                statusText.innerText = 'System ready. Tap card to speak with Daniel';
            }
        };

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            statusText.innerText = 'Daniel is processing query...';
            await sendToAssistant(transcript);
        };

        recognition.onerror = () => {
            statusText.innerText = 'Neural link disrupted. Try again.';
            showIdleState();
        };
    } else {
        statusText.innerText = 'Speech recognition unavailable on this browser client.';
    }

    function showIdleState() {
        idleCard.style.display = 'flex';
        soundbarPanel.style.display = 'none';
    }

    function showReplyingState() {
        idleCard.style.display = 'none';
        soundbarPanel.style.display = 'flex';
    }

    function initVoices() {
        const voices = window.speechSynthesis.getVoices();
        selectedVoice = voices.find(v => v.name.includes("Daniel") || v.lang === "en-GB") || voices[0];
    }
    window.speechSynthesis.onvoiceschanged = initVoices;
    initVoices();

    function toggleListening() {
        if (!recognition) return;
        if (isListening) {
            recognition.stop();
        } else {
            recognition.start();
        }
    }

    async function sendToAssistant(message) {
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });

            if (!response.ok) throw new Error('API Error');

            const data = await response.json();
            statusText.innerText = 'Daniel is responding...';
            
            showReplyingState();
            speak(data.reply);
        } catch (err) {
            statusText.innerText = 'Connection fault with server backend.';
            showIdleState();
        }
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        if (selectedVoice) utterance.voice = selectedVoice;
        utterance.rate = 1.0;

        utterance.onend = () => {
            statusText.innerText = 'System ready. Tap card to speak with Daniel';
            showIdleState();
        };

        window.speechSynthesis.speak(utterance);
    }

    showIdleState();
</script>

</body>
</html>
